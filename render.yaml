# Render.com deployment configuration for Nexora Shipping Backend
# Docs: https://render.com/docs/render-yaml

services:
  - type: web
    name: nexora-shipping-api
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install --include=dev --no-package-lock && npm run build
    # `prisma db push` is best-effort: if the database is unreachable
    # (Cloud SQL stopped, firewall blocking us, etc.) we still start the
    # server so /health stays green and Render stops crash-looping. The
    # app itself will 500 on DB-touching routes until the DB comes back,
    # but the deploy stabilizes.
    startCommand: npx prisma db push --skip-generate --accept-data-loss || echo '[prisma] db push failed - starting server anyway'; npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard (Google Cloud SQL connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # e.g. https://nexora-shipping.vercel.app
      - key: GOOGLE_CLOUD_PROJECT_ID
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false   # Paste entire service account JSON as a string
      - key: ADMIN_SETUP_SECRET
        sync: false   # A secret string you choose; used once to promote your account to ADMIN
      - key: ADMIN_EMAIL
        sync: false   # e.g. admin@nexorashipping.com  — the only email allowed to use admin login
      - key: ADMIN_PASSWORD
        sync: false   # e.g. MySecureAdminPass@2026  — plain text admin password checked server-side
